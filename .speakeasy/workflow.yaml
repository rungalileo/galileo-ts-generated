workflowVersion: 1.0.0
speakeasyVersion: latest
sources:
    FastAPI:
        inputs:
            - location: https://api.galileo.ai/client/openapi.json
        overlays:
            - location: .speakeasy/overlays/document-schema.yaml
        output: .speakeasy/out.openapi.yaml
        registry:
            location: registry.speakeasyapi.dev/galileo-ai/ts-sdk/fast-api
targets:
    galileo-generated:
        target: typescript
        source: FastAPI
        publish:
            npm:
                token: $npm_token
        codeSamples:
            registry:
                location: registry.speakeasyapi.dev/galileo-ai/ts-sdk/fast-api-typescript-code-samples
            labelOverride:
                fixedValue: Typescript (SDK)
            blocking: false
